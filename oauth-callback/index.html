<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Conectando Mercado Livre</title>
  <link rel="stylesheet" href="callback.css">
</head>
<body>
  <main>
    <div class="brand">AFFILIATE DEALS BOT</div>
    <section class="card">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <div id="icon" class="icon" hidden></div>
      <h1 id="title">Conectando sua conta</h1>
      <p id="message">A autorização foi recebida. Estamos retornando ao bot local…</p>
      <a id="continueButton" class="button" href="#" hidden>Continuar no bot</a>
      <details id="help" hidden>
        <summary>O bot não abriu?</summary>
        <p>Confirme que o Affiliate Bot está em execução neste computador e tente novamente.</p>
        <code id="callbackUrl"></code>
      </details>
    </section>
    <p class="privacy">Nenhuma senha ou token é armazenado nesta página.</p>
  </main>
  <script src="callback.js"></script>
</body>
</html>
